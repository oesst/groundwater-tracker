name: Fetch groundwater data

on:
  schedule:
    - cron: '23 4 * * 1,4'   # Mon & Thu 04:23 UTC (~twice weekly). UTC, best-effort (may lag).
  workflow_dispatch: {}       # manual "Run workflow" button

# Prevent overlapping runs.
concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write             # allow committing data/ back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No runtime dependencies — Node 20 has global fetch. (npm ci only if you add deps.)
      - name: Run pipeline
        run: node fetch/run.js

      - name: Commit snapshot
        run: |
          git config user.name  "gw-bot"
          git config user.email "gw-bot@users.noreply.github.com"
          # latest.json never 3-way-merges (see .gitattributes); keep our fresh one.
          git config merge.ours.driver true
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: groundwater snapshot $(date -u +%F)"
          # Rebase/merge in anything pushed meanwhile, then push; retry on races.
          for i in 1 2 3; do
            git pull --no-rebase --no-edit origin main && git push && exit 0
            echo "push race, retrying ($i)..."; sleep 5
          done
          echo "push failed after retries"; exit 1
